name: Update download badge

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  release:
    types: [published, edited, deleted]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: download-badge
  cancel-in-progress: false

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Fetch download ledger (kept on the tracker-data branch)
        run: |
          git fetch origin tracker-data:tracker-data 2>/dev/null || true
          git show tracker-data:ledger.json > "$RUNNER_TEMP/ledger.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/ledger.json"

      - name: Build badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/download_badge.py "$RUNNER_TEMP/ledger.json"

      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add "$RUNNER_TEMP/data" tracker-data
          cp "$RUNNER_TEMP/ledger.json" "$RUNNER_TEMP/data/ledger.json"
          cd "$RUNNER_TEMP/data"
          if ! git diff --quiet -- ledger.json; then
            git add ledger.json
            git commit -m "Update download ledger"
            git push origin tracker-data
          fi

      - name: Commit badge if changed
        run: |
          if git diff --quiet -- downloads.svg; then
            echo "No change"; exit 0
          fi
          git add downloads.svg
          git commit -m "Update download badge"
          git pull --rebase origin main
          git push origin HEAD:main
