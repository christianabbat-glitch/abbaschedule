name: Update download badge

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  release:
    types: [published, edited]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  badge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/download_badge.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- downloads.svg && git ls-files --error-unmatch downloads.svg >/dev/null 2>&1; then
            echo "No change"; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add downloads.svg
          git commit -m "Update download badge"
          git push
