name: Sync app + update download badge

# Runs on the `home` branch (the repo's default branch, shown on the repo page).
# App uploads go to `main` (which GitHub Pages publishes) and may replace the
# whole tree there. This job copies main's app files onto `home` while keeping
# the tracker files (README.md, downloads.svg, .github/) that only live here,
# then refreshes the download badge. Nothing pushed to `main` can remove it.

on:
  schedule:
    - cron: "*/5 * * * *"   # every 5 minutes (GitHub's minimum)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: home-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: home
          fetch-depth: 0

      - name: Mirror app files from main, keep tracker files
        run: |
          git fetch origin main
          git rm -rqf --ignore-unmatch .
          git checkout origin/main -- .
          git checkout HEAD -- README.md downloads.svg .github

      - name: Fetch download ledger (tracker-data branch)
        run: |
          git fetch origin tracker-data:tracker-data 2>/dev/null || true
          git show tracker-data:ledger.json > "$RUNNER_TEMP/ledger.json" 2>/dev/null || echo '{}' > "$RUNNER_TEMP/ledger.json"

      - name: Build badge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/download_badge.py "$RUNNER_TEMP/ledger.json"

      - name: Save ledger
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git worktree add "$RUNNER_TEMP/data" tracker-data
          cp "$RUNNER_TEMP/ledger.json" "$RUNNER_TEMP/data/ledger.json"
          cd "$RUNNER_TEMP/data"
          if ! git diff --quiet -- ledger.json; then
            git add ledger.json
            git commit -m "Update download ledger"
            git push origin tracker-data
          fi

      - name: Commit to home if anything changed
        run: |
          git add -A
          if git diff --cached --quiet; then echo "No change"; exit 0; fi
          git commit -m "Sync from main ($(git rev-parse --short origin/main)) + update download badge"
          git push origin HEAD:home
